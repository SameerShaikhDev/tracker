<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ff" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Interview Ready Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0f17'/%3E%3Cpath d='M16 34l12 12 21-26' fill='none' stroke='%2334d399' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">✔</div>
    <div>
      <h1 id="hdrTitle">Interview Ready</h1>
      <p id="hdrSub">Loading…</p>
    </div>
  </div>
  <button class="icon-btn" id="btnBell" aria-label="Alarms" title="Alarms">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="dot" id="bellDot" hidden></span>
  </button>
</header>

<main id="app">
  <section class="view" id="v-today"></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-gym" hidden></section>
  <section class="view" id="v-stats" hidden></section>
  <section class="view" id="v-alarms" hidden></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Today</span></button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span>Plan</span></button>
  <button data-tab="gym"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>Gym</span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></button>
  <button data-tab="alarms"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M4 4l3-2M20 4l-3-2"/></svg><span>Alarms</span></button>
</nav>

<!-- Alarm ringing overlay -->
<div class="ring" id="ring" hidden>
  <div class="ring-card">
    <div class="ring-pulse">⏰</div>
    <div class="ring-time" id="ringTime"></div>
    <h2 id="ringTitle"></h2>
    <p id="ringNote"></p>
    <p class="rq" id="ringQuote"></p>
    <div class="ring-actions">
      <button class="btn big ok" id="ringDone">Done ✔</button>
      <button class="btn big" id="ringSnooze">Snooze 5 min</button>
      <button class="btn ghost" id="ringStop">Dismiss</button>
    </div>
  </div>
</div>

<!-- Generic bottom sheet -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
